name: Build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Localizar el proyecto (donde esté main.py)
        run: |
          D=$(dirname "$(find . -name main.py -not -path './.git/*' | head -1)")
          echo "APP_DIR=$D" >> "$GITHUB_ENV"
          echo "Proyecto en: $D"
      - run: pip install "flet[all]==0.80.5" pygments pyinstaller jedi pillow
      - name: Crear carpeta monaco y descargar Monaco
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p monaco installer
          npm pack monaco-editor@0.52.2
          tar -xzf monaco-editor-0.52.2.tgz -C monaco --strip-components=2 package/min/vs
      - name: Generar app
        working-directory: ${{ env.APP_DIR }}
        run: |
          JD=$(python -c "import jedi,os;print(os.path.dirname(jedi.__file__).replace(chr(92),'/'))")
          PD=$(python -c "import parso,os;print(os.path.dirname(parso.__file__).replace(chr(92),'/'))")
          ICO=""; [ -f assets/icon.png ] && ICO="--icon assets/icon.png"
          flet pack main.py --name BlocDeNotas -y --onedir $ICO --add-data "monaco;monaco" --add-data "$JD;jedi" --add-data "$PD;parso"
      - run: choco install innosetup -y --no-progress
        shell: pwsh
      - name: Crear instalador
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: BlocDeNotas-Windows-Setup
          path: ${{ env.APP_DIR }}/installer/BlocDeNotas-Setup.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.APP_DIR }}/installer/BlocDeNotas-Setup.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Localizar el proyecto (donde esté main.py)
        run: |
          D=$(dirname "$(find . -name main.py -not -path './.git/*' | head -1)")
          echo "APP_DIR=$D" >> "$GITHUB_ENV"
      - run: pip install "flet[all]==0.80.5"
      - name: Gradle - targetSdk 27 y applicationId com.termux (exec de binarios propios + HTTP local)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/termux.gradle <<'EOT'
          allprojects { p ->
            p.afterEvaluate {
              if (p.plugins.hasPlugin('com.android.application')) {
                p.android.defaultConfig.targetSdkVersion 27
                p.android.defaultConfig.applicationId 'com.termux'
                try { p.android.lint.checkReleaseBuilds = false } catch (e) {}
                try { p.android.lint.abortOnError = false } catch (e) {}
              }
            }
          }
          EOT
      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Crear carpeta app (solo lo necesario para Android)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app"
          cp "$APP_DIR/main.py" "$APP_DIR/monaco_bridge.py" "$APP_DIR/termux_env.py" "$APP_DIR/pyproject.toml" "$GITHUB_WORKSPACE/app/"
          [ -d "$APP_DIR/assets" ] && cp -r "$APP_DIR/assets" "$GITHUB_WORKSPACE/app/assets"
          cd "$GITHUB_WORKSPACE/app" && mkdir -p monaco xterm
          npm pack monaco-editor@0.52.2 xterm@5.3.0 xterm-addon-fit@0.8.0 --silent
          tar -xzf monaco-editor-0.52.2.tgz -C monaco --strip-components=2 package/min/vs
          tar -xzf xterm-5.3.0.tgz -C xterm --strip-components=2 package/lib/xterm.js package/css/xterm.css
          tar -xzf xterm-addon-fit-0.8.0.tgz -C xterm --strip-components=2 package/lib/xterm-addon-fit.js
          rm -f *.tgz
      - name: Compilar APK
        working-directory: app
        run: flet build apk --yes --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: BlocDeNotas-Android-APK
          path: app/build/apk/*.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/apk/*.apk
